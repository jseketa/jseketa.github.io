{% extend "base.html" title = page.title + " - " + config.title, description = page.description or config.description %}
<main class="wrap man">
  <div class="hdr">
    <span><a href="{{ url("@/info.md") }}">~</a>/{{ page.file }}</span>
  </div>

  <h1>{{ page.title }}</h1>

  <article class="body prose">
    {{ page.content }}
  </article>

</main>
