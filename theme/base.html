<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">

  <link rel="preload" as="font" type="font/woff2" href="{{ url("fonts/IBMPlexMono-Regular.woff2") }}" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ url("fonts/IBMPlexSans-Regular.woff2") }}" crossorigin>

  <link rel="stylesheet" href="{{ url("main.css") }}">

  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'light') t = 'paper';
      if (t === 'dark') t = 'amber';
      if (t && /^(paper|snow|amber|green|white)$/.test(t)) {
        document.documentElement.setAttribute('data-theme', t);
      }
    })();
  </script>

  <link rel="icon" href="{{ url("assets/favicon.ico") }}" type="image/x-icon">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ url("atom.xml") }}">
</head>
<body>

<div class="topbar wrap">
  <span class="theme-toggle" role="group" aria-label="Theme">
    <button type="button" class="theme-toggle__opt theme-toggle__opt--paper" data-theme-set="paper">paper</button>
    <button type="button" class="theme-toggle__opt theme-toggle__opt--snow" data-theme-set="snow">snow</button>
    <button type="button" class="theme-toggle__opt theme-toggle__opt--amber" data-theme-set="amber">amber</button>
    <button type="button" class="theme-toggle__opt theme-toggle__opt--green" data-theme-set="green">green</button>
    <button type="button" class="theme-toggle__opt theme-toggle__opt--white" data-theme-set="white">white</button>
  </span>
</div>

{% yield %}

<script src="{{ url("js/theme.js") }}" defer></script>
{# Which libraries a page loads is derived from the blocks it actually
   contains, not declared in front matter - a page cannot drift out of sync
   with a flag it forgot to set. #}
{% if has(scripts, "mermaid") %}
<script defer src="{{ url("js/mermaid/mermaid.min.js") }}"></script>
<script defer src="{{ url("js/mermaid/mermaid-config.js") }}"></script>
{% end %}
{% if has(scripts, "wavedrom") %}
<script defer src="{{ url("js/wavedrom/wavedrom.min.js") }}"></script>
<script defer src="{{ url("js/wavedrom/default.js") }}"></script>
<script defer src="{{ url("js/wavedrom/narrow.js") }}"></script>
<script defer src="{{ url("js/wavedrom/wavedrom-init.js") }}"></script>
{% end %}
</body>
</html>
